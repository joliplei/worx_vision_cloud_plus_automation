                      zones: []
                  - alias: Auf Bestätigung des zweiten Mähstarts warten
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {{ states(mower_entity) in ['docked', 'paused']
                               and (
                                 (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                                  and not is_state(rain_binary_sensor, 'on'))
                                 or
                                 (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                                  and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                                  and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                               )
                               and state_attr(mower_entity, 'rain_delay') != true
                               and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                      sequence:
                        - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true }}
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            alias: Nächsten Versuch nach Regen beim erneuten Versuch speichern
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: Mähen unterbrochen"
                      message: |
                        Zeit:
                        Start: {{ mowing_cycle_started_at }}
                        Ende: {{ now().strftime('%d.%m %H:%M') }}

                        Grund:
                        Regen beim erneuten Start des normalen Mähens.

                        {{ retry_notification_details | trim }}
                  - stop: Mähstart durch Regen nach erneuten Versuch unterbrochen.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            alias: Nächsten Versuch nach fehlendem Start speichern
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: Mähen unterbrochen"
                      message: |
                        Zeit:
                        Start: {{ mowing_cycle_started_at }}
                        Ende: {{ now().strftime('%d.%m %H:%M') }}

                        Grund:
                        Normales Mähen startete nicht nach zwei Versuchen.
                        Roboterstatus: {{ states(mower_entity) }}.

                        {{ retry_notification_details | trim }}
                  - stop: Start des Mähens nach zwei Versuchen nicht bestätigt.
          - condition: template
            alias: Normales Mähen gestartet
            value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
          - alias: Mähen bis zur Rückkehr des Roboters oder Sicherheitslimit
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                    {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                    {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                    {% set vision_complete = is_state(mower_entity, 'docked')
                        and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                        and state_attr(mower_entity, 'rain_delay') != true
                        and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                    {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                        else is_state(mower_entity, 'docked') %}
                    {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                         and not is_state(rain_binary_sensor, 'on'))
                        or
                        (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                         and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                         and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                       and state_attr(mower_entity, 'rain_delay') != true
                       and not completed
                       and repeat.index <= (normal_mowing_monitor_limit_minutes | int(480)) }}
              sequence:
                - delay: "00:01:00"
          - variables:
              normal_mowing_finished_ts: >-
                {% if is_state(mower_entity, 'docked') %}
                  {{ as_timestamp(states[mower_entity].last_changed) }}
                {% else %}
                  {{ as_timestamp(now()) }}
                {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
          - wait_template: >-
              {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                  and is_state(rain_binary_sensor, 'on'))
                 or
                 (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                  and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                       or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                 or state_attr(mower_entity, 'rain_delay') == true
                 or is_state(mower_entity, 'docked') }}
            alias: Auf Rückkehr zur Basis nach normalem Mähen warten
            timeout: "00:30:00"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                           and not is_state(rain_binary_sensor, 'on'))
                          or
                          (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                           and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                           and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         and state_attr(mower_entity, 'rain_delay') != true }}
                sequence:
                  - delay: "00:01:00"
                    alias: Basis-Bestätigung nach normalem Mähen stabilisieren
                  - wait_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true
                         or is_state(mower_entity, 'docked') }}
                    alias: Stabile Rückkehr zur Basis nach normalem Mähen bestätigen
                    timeout: "00:02:00"
                    continue_on_timeout: true
          - variables:
              mowing_cycle_finished_at: >-
                {{ (normal_mowing_finished_ts | float) | timestamp_custom('%d.%m %H:%M', true) }}
              whole_cycle_minutes: >-
                {{ ((((normal_mowing_finished_ts | float) - (mowing_cycle_started_ts | float)) / 60) | round(0)) | int }}
          - variables:
              whole_cycle_duration_label: >-
                {% set total = whole_cycle_minutes | int %}
                {% if total >= 60 %}
                  {{ total // 60 }} Std. {{ total % 60 }} Min.
                {% else %}
                  {{ total }} Min.
                {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                      {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                      {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                      {% set vision_complete = is_state(mower_entity, 'docked')
                          and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                          and state_attr(mower_entity, 'rain_delay') != true
                          and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                      {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                           and not is_state(rain_binary_sensor, 'on'))
                          or
                          (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                           and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                           and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         and state_attr(mower_entity, 'rain_delay') != true
                         and (vision_complete if mower_cycle_type == 'vision_rtk'
                              else is_state(mower_entity, 'docked')) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (forecast_weather_entity | trim | length) > 0 }}"
                        sequence:
                          - action: weather.get_forecasts
                            continue_on_error: true
                            target:
                              entity_id: "{{ forecast_weather_entity | trim }}"
                            data:
                              type: hourly
                            response_variable: weather_forecast_after_mow
                  - variables:
                      planned_next_after_reset_datetime: >-
                        {%- set fallback = next_mow_after_reset_datetime | trim -%}
                        {%- set step = auto_planning_step_seconds | int(900) -%}
                        {%- set earliest_allowed_ts = [as_timestamp(fallback), as_timestamp(now()) + 300, rain_drying_ready_ts | float(0)] | max -%}
                        {%- set fallback_check_ts = ((earliest_allowed_ts / step) | round(0, 'ceil') | int) * step -%}
                        {%- set candidate_date = earliest_allowed_ts | timestamp_custom('%Y-%m-%d', true) -%}
                        {%- set preferred_start = as_timestamp(candidate_date ~ ' ' ~ primary_start_time_value) -%}
                        {%- set raw_preferred_end = as_timestamp(candidate_date ~ ' ' ~ backup_start_time_value) -%}
                        {%- if backup_start_time_value <= primary_start_time_value and (earliest_allowed_ts | timestamp_custom('%H:%M:%S', true)) < backup_start_time_value -%}
                          {%- set preferred_start = preferred_start - 86400 -%}
                          {%- set preferred_end = raw_preferred_end -%}
                        {%- else -%}
                          {%- set preferred_end = raw_preferred_end if raw_preferred_end > preferred_start else raw_preferred_end + 86400 -%}
                        {%- endif -%}
                        {%- if earliest_allowed_ts <= preferred_start -%}
                          {%- set preferred_candidate_ts = preferred_start -%}
                        {%- elif earliest_allowed_ts <= preferred_end -%}
                          {%- set preferred_candidate_ts = fallback_check_ts -%}
                        {%- else -%}
                          {%- set preferred_candidate_ts = preferred_start + 86400 -%}
                        {%- endif -%}
                        {%- if planning_mode != 'auto' or weather_forecast_after_mow is not defined or weather_forecast_after_mow is not mapping -%}
                          {{ preferred_candidate_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                        {%- else -%}
                          {%- set items = weather_forecast_after_mow.get(forecast_weather_entity | trim, {}).get('forecast', []) -%}
                          {%- set limited_items = items[:(weather_forecast_max_items | int(120))] -%}
                          {%- set horizon = namespace(max=0) -%}
                          {%- for item in limited_items -%}
                            {%- set item_ts = as_timestamp(item.datetime) -%}
                            {%- if item_ts > horizon.max -%}
                              {%- set horizon.max = item_ts -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- if horizon.max > 0 -%}
                            {%- set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] -%}
                            {%- set ns = namespace(selected_ts=0) -%}
                            {%- set first_day_ts = earliest_allowed_ts -%}
                            {%- set earliest_clock = earliest_allowed_ts | timestamp_custom('%H:%M:%S', true) -%}
                            {%- if backup_start_time_value <= primary_start_time_value and earliest_clock < backup_start_time_value -%}
                              {%- set first_day_ts = earliest_allowed_ts - 86400 -%}
                            {%- endif -%}
                            {%- set first_day = first_day_ts | timestamp_custom('%Y-%m-%d', true) -%}
                            {%- for day in range(0, weather_search_days | int(4)) -%}
                              {%- set day_ns = namespace(preferred_ts=0, preferred_score=999999, fallback_ts=0, fallback_score=999999) -%}
                              {%- set day_ts = as_timestamp(first_day ~ ' 00:00:00') + (day * 86400) -%}
                              {%- set target_date = day_ts | timestamp_custom('%Y-%m-%d', true) -%}
                              {%- set preferred_start = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) -%}
                              {%- set raw_preferred_end = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) -%}
                              {%- set preferred_end = raw_preferred_end if raw_preferred_end > preferred_start else raw_preferred_end + 86400 -%}
                              {%- if mowing_window_preset == 'night' -%}
                                {%- set search_start = preferred_start -%}
                                {%- set raw_search_end = preferred_end -%}
                              {%- else -%}
                                {%- set search_start = as_timestamp(target_date ~ ' 06:00:00') -%}
                                {%- if fiatlux_installed | bool -%}
                                  {%- set raw_search_end = as_timestamp(target_date ~ ' 05:00:00') + 86400 -%}
                                {%- else -%}
                                  {%- set raw_search_end = as_timestamp(target_date ~ ' 22:00:00') -%}
                                {%- endif -%}
                              {%- endif -%}
                              {%- set search_end = [raw_search_end, horizon.max + 3600] | min -%}
                              {%- set start_ts = [search_start, earliest_allowed_ts] | max -%}
                              {%- if start_ts <= search_end -%}
                                {%- set window_mid = ((preferred_start + preferred_end) / 2) -%}
                                {%- set first_slot = ((start_ts / step) | round(0, 'ceil') | int) * step -%}
                                {%- set slots = [(((search_end - first_slot) / step) | round(0, 'floor') | int) + 1, 0] | max -%}
                                {%- for slot in range(0, slots) -%}
                                  {%- set ts = first_slot + (slot * step) -%}
                                  {%- set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='', confidence=70) -%}
                                  {%- set recent = namespace(rain=0, heavy_window_rain=0, bad=0) -%}
                                  {%- set future = namespace(seen=0, rain=0, probability=0, unsafe=0) -%}
                                  {%- for item in limited_items -%}
                                    {%- set item_ts = as_timestamp(item.datetime) -%}
                                    {%- if item_ts <= ts and item_ts > (ts - 3600) -%}
                                      {%- set fc.seen = 1 -%}
                                      {%- set fc.rain = item.precipitation | default(0) | float(0) -%}
                                      {%- set fc.probability = item.precipitation_probability | default(0) | float(0) -%}
                                      {%- set fc.temp = item.temperature | default(temp_c) | float(temp_c) -%}
                                      {%- set fc.wind = item.wind_speed | default(0) | float(0) -%}
                                      {%- set fc.humidity = item.humidity | default(60) | float(60) -%}
                                      {%- set fc.condition = item.condition | default('') -%}
                                      {%- set fc.confidence = item.confidence | default(70) | float(70) -%}
                                    {%- endif -%}
                                    {%- if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) -%}
                                      {%- set recent_rain = item.precipitation | default(0) | float(0) -%}
                                      {%- set recent_condition = item.condition | default('') -%}
                                      {%- set recent.rain = recent.rain + recent_rain -%}
                                      {%- if recent_condition in bad -%}
                                        {%- set recent.bad = 1 -%}
                                      {%- endif -%}
                                    {%- endif -%}
                                    {%- if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 7200)) -%}
                                      {%- set recent.heavy_window_rain = recent.heavy_window_rain + (item.precipitation | default(0) | float(0)) -%}
                                    {%- endif -%}
                                    {%- if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) -%}
                                      {%- set future.seen = future.seen + 1 -%}
                                      {%- set future_rain = item.precipitation | default(0) | float(0) -%}
                                      {%- set future_probability = item.precipitation_probability | default(0) | float(0) -%}
                                      {%- set future_temp = item.temperature | default(temp_c) | float(temp_c) -%}
                                      {%- set future_humidity = item.humidity | default(60) | float(60) -%}
                                      {%- set future_condition = item.condition | default('') -%}
                                      {%- set future.rain = future.rain + future_rain -%}
                                      {%- if future_probability > future.probability -%}
                                        {%- set future.probability = future_probability -%}
                                      {%- endif -%}
                                      {%- if ((forecast_rain_is_advisory | string | lower) != 'true'
                                              and future_condition in bad)
                                          or future_temp < (min_mowing_temperature_c | float(10))
                                          or future_temp > (max_mowing_temperature_c | float(25))
                                          or future_humidity > (wet_grass_humidity_percent | float(88)) -%}
                                        {%- set future.unsafe = 1 -%}
                                      {%- endif -%}
                                    {%- endif -%}
                                  {%- endfor -%}
                                  {%- set recent_wet = recent.rain > (forecast_rain_block_mm | float(0.2))
                                      or recent.bad == 1
                                      or recent.heavy_window_rain > (max_rain_24h_mm | float(3)) -%}
                                  {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                                      and (future.rain > (forecast_rain_block_mm | float(0.2))
                                           or future.probability > (high_rain_probability_percent | float(75))) -%}
                                    {%- set future.unsafe = 1 -%}
                                  {%- endif -%}
                                  {%- set rain_score = 0 if (forecast_rain_is_advisory | string | lower) == 'true'
                                      else ((fc.rain * 500) + (future.rain * 300) + (fc.probability * 3) + (future.probability * 1.5)) -%}
                                  {%- set score = rain_score + (((fc.temp - 20) | abs) * 2) + (fc.wind * 0.8) + ((100 - fc.confidence) * 0.4) + ((((ts - window_mid) | abs) / 3600) * 1.2) + (((ts - earliest_allowed_ts) / 86400) * (forecast_delay_penalty_per_day | float(8))) -%}
                                  {%- if fc.seen == 0 -%}
                                    {%- set score = score + 120 -%}
                                  {%- endif -%}
                                  {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                                      and (fc.rain > (forecast_rain_block_mm | float(0.2)) or fc.condition in bad) -%}
                                    {%- set score = score + 10000 -%}
                                  {%- endif -%}
                                  {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                                      and fc.probability > (high_rain_probability_percent | float(75)) -%}
                                    {%- set score = score + 2000 -%}
                                  {%- endif -%}
                                  {%- if recent_wet and (forecast_rain_is_advisory | string | lower) != 'true' -%}
                                    {%- set score = score + 1800 + (recent.rain * 200) + (recent.heavy_window_rain * 100) -%}
                                  {%- endif -%}
                                  {%- if future.unsafe == 1 or future.seen < (forecast_min_future_hours | int(2)) -%}
                                    {%- set score = score + 6000 -%}
                                  {%- endif -%}
                                  {%- if fc.humidity > (wet_grass_humidity_percent | float(88)) -%}
                                    {%- set score = score + 250 -%}
                                  {%- elif fc.humidity > 82 -%}
                                    {%- set score = score + 80 -%}
                                  {%- endif -%}
                                  {%- set safe = fc.seen == 1
                                      and fc.temp >= (min_mowing_temperature_c | float(10))
                                      and fc.temp <= (max_mowing_temperature_c | float(25))
                                      and ((forecast_rain_is_advisory | string | lower) == 'true'
                                           or ((fc.rain + future.rain) <= (forecast_rain_block_mm | float(0.2))
                                               and fc.condition not in bad
                                               and fc.probability <= (high_rain_probability_percent | float(75))
                                               and not recent_wet))
                                      and future.unsafe == 0
                                      and future.seen >= (forecast_min_future_hours | int(2))
                                      and fc.humidity <= (wet_grass_humidity_percent | float(88))
                                      and (mowing_window_preset != 'night' or (fiatlux_installed | bool)) -%}
                                  {%- if safe and score < day_ns.fallback_score -%}
                                    {%- set day_ns.fallback_score = score -%}
                                    {%- set day_ns.fallback_ts = ts -%}
                                  {%- endif -%}
                                  {%- if safe and ts >= preferred_start and ts <= preferred_end and score < day_ns.preferred_score -%}
                                    {%- set day_ns.preferred_score = score -%}
                                    {%- set day_ns.preferred_ts = ts -%}
                                  {%- endif -%}
                                {%- endfor -%}
                              {%- endif -%}
                              {%- if ns.selected_ts == 0 -%}
                                {%- if day_ns.preferred_ts > 0 -%}
                                  {%- set ns.selected_ts = day_ns.preferred_ts -%}
                                {%- elif day_ns.fallback_ts > 0 -%}
                                  {%- set ns.selected_ts = day_ns.fallback_ts -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {%- if ns.selected_ts > 0 -%}
                              {{ ns.selected_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                            {%- else -%}
                              {{ preferred_candidate_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                            {%- endif -%}
                          {%- else -%}
                            {{ preferred_candidate_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                          {%- endif -%}
                        {%- endif -%}
                  - variables:
                      planned_next_after_reset_future_status: >-
                        {% if weather_forecast_after_mow is not defined or weather_forecast_after_mow is not mapping %}
                          unknown
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(forecast_weather_entity | trim, {}).get('forecast', []) %}
                          {% set limited_items = items[:(weather_forecast_max_items | int(120))] %}
                          {% set ts = as_timestamp(planned_next_after_reset_datetime | trim) %}
                          {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                          {% set future = namespace(seen=0, rain=0, probability=0, unsafe=0) %}
                          {% for item in limited_items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) %}
                              {% set future.seen = future.seen + 1 %}
                              {% set future.rain = future.rain + (item.precipitation | default(0) | float(0)) %}
                              {% set item_probability = item.precipitation_probability | default(0) | float(0) %}
                              {% if item_probability > future.probability %}
                                {% set future.probability = item_probability %}
                              {% endif %}
                              {% if ((forecast_rain_is_advisory | string | lower) != 'true'
                                      and (item.condition | default('')) in bad)
                                  or (item.temperature | default(temp_c) | float(temp_c)) < (min_mowing_temperature_c | float(10))
                                  or (item.temperature | default(temp_c) | float(temp_c)) > (max_mowing_temperature_c | float(25))
                                  or (item.humidity | default(60) | float(60)) > (wet_grass_humidity_percent | float(88)) %}
                                {% set future.unsafe = 1 %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% if (forecast_rain_is_advisory | string | lower) != 'true'
                              and (future.rain > (forecast_rain_block_mm | float(0.2))
                                   or future.probability > (high_rain_probability_percent | float(75))) %}
                            {% set future.unsafe = 1 %}
                          {% endif %}
                          {{ 'safe' if future.unsafe == 0 and future.seen >= (forecast_min_future_hours | int(2)) else 'unsafe' }}
                        {% endif %}
                  - variables:
                      planned_next_after_reset_label: >-
                        {% set raw = planned_next_after_reset_datetime | trim %}
                        {% set ts = as_timestamp(raw) %}
                        {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                        {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                        {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                        {% if days <= 0 %}heute um {{ ts | timestamp_custom('%H:%M', true) }}
                        {% elif days == 1 %}morgen um {{ ts | timestamp_custom('%H:%M', true) }}
                        {% elif days == 2 %}in 2 Tagen um {{ ts | timestamp_custom('%H:%M', true) }}
                        {% else %}in {{ days }} Tagen um {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
                      planned_next_after_reset_reason: >-
                        {% if planning_mode != 'auto' or weather_forecast_after_mow is not defined or weather_forecast_after_mow is not mapping %}
                          Ein weiterer Termin aus dem eingestellten Mähfenster wurde gewählt, ohne Bewertung der stündlichen Vorhersage
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(forecast_weather_entity | trim, {}).get('forecast', []) %}
                          {% set limited_items = items[:(weather_forecast_max_items | int(120))] %}
                          {% set ts = as_timestamp(planned_next_after_reset_datetime | trim) %}
                          {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                          {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                          {% set recent = namespace(rain=0, heavy_window_rain=0, bad=0) %}
                          {% set future = namespace(rain=0, probability=0) %}
                          {% for item in limited_items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts <= ts and item_ts > (ts - 3600) %}
                              {% set fc.seen = 1 %}
                              {% set fc.rain = item.precipitation | default(0) | float(0) %}
                              {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                              {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                              {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                              {% set fc.humidity = item.humidity | default(60) | float(60) %}
                              {% set fc.condition = item.condition | default('') %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                              {% set recent_rain = item.precipitation | default(0) | float(0) %}
                              {% set recent_condition = item.condition | default('') %}
                              {% set recent.rain = recent.rain + recent_rain %}
                              {% if recent_condition in bad %}
                                {% set recent.bad = 1 %}
                              {% endif %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 7200)) %}
                              {% set recent.heavy_window_rain = recent.heavy_window_rain + (item.precipitation | default(0) | float(0)) %}
                            {% endif %}
                            {% if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) %}
                              {% set future.rain = future.rain + (item.precipitation | default(0) | float(0)) %}
                              {% set item_probability = item.precipitation_probability | default(0) | float(0) %}
                              {% if item_probability > future.probability %}
                                {% set future.probability = item_probability %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% set recent_wet = recent.rain > (forecast_rain_block_mm | float(0.2))
                              or recent.bad == 1
                              or recent.heavy_window_rain > (max_rain_24h_mm | float(3)) %}
                          {% set selected_clock = ts | timestamp_custom('%H:%M:%S', true) %}
                          {% if backup_start_time_value <= primary_start_time_value %}
                            {% set inside_preferred_window = selected_clock >= primary_start_time_value or selected_clock <= backup_start_time_value %}
                          {% else %}
                            {% set inside_preferred_window = selected_clock >= primary_start_time_value and selected_clock <= backup_start_time_value %}
                          {% endif %}
                          {% if fc.seen == 0 %}
                            dies ist der nächste sinnvolle Termin, aber die stündliche Vorhersage hat für diese Stunde keine genauen Daten mehr
                          {% elif fc.temp < (min_mowing_temperature_c | float(10)) %}
                            die vorhergesagte Temperatur von {{ fc.temp | round(1) }} °C liegt unter dem empfohlenen Minimum von {{ min_mowing_temperature_c }} °C, daher könnte der Termin verschoben werden
                          {% elif fc.temp > (max_mowing_temperature_c | float(25)) %}
                            die vorhergesagte Temperatur von {{ fc.temp | round(1) }} °C überschreitet das empfohlene Maximum von {{ max_mowing_temperature_c }} °C, daher könnte der Termin verschoben werden
                          {% elif (forecast_rain_is_advisory | string | lower) == 'true'
                                and ((fc.rain + future.rain) > (forecast_rain_block_mm | float(0.2)) or fc.condition in bad) %}
                            die Vorhersage kündigt Niederschlag an, aber der tatsächliche Sensor hat Vorrang; der Roboter startet, wenn der Sensor zum Startzeitpunkt immer noch trocken ist
                          {% elif (forecast_rain_is_advisory | string | lower) != 'true'
                                and ((fc.rain + future.rain) > (forecast_rain_block_mm | float(0.2)) or fc.condition in bad) %}
                            dies ist der sicherste verfügbare Termin in der Vorhersage, aber der vorhergesagte Niederschlag während des Mähens beträgt {{ (fc.rain + future.rain) | round(2) }} mm
                          {% elif (planned_next_after_reset_future_status | trim) != 'safe' %}
                            die Vorhersage bestätigt keine sicheren Bedingungen für die nächsten {{ forecast_dry_horizon_hours }} Stunden, daher könnte der Termin erneut verschoben werden
                          {% elif not inside_preferred_window %}
                            dies ist die nächste sichere Stunde außerhalb des bevorzugten Fensters; im gewählten Fenster gibt es keine Bedingungen, die Temperatur, Niederschlag und Luftfeuchtigkeit erfüllen
                          {% elif recent_wet and (forecast_rain_is_advisory | string | lower) != 'true' %}
                            die Automatisierung wartet nach Regen, damit das nächste Mähen nicht auf frisch nassem Rasen stattfindet
                          {% elif fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                            dies ist der beste verfügbare Termin, aber die Luftfeuchtigkeit ist immer noch hoch, daher könnte der Start erneut verschoben werden
                          {% else %}
                            die Vorhersage zeigt keinen Regen, eine Pause nach Niederschlägen und das geringste Risiko von nassem Gras im gewählten Fenster
                          {% endif %}
                        {% endif %}
                      planned_next_after_reset_forecast: >-
                        {% if weather_forecast_after_mow is not defined or weather_forecast_after_mow is not mapping %}
                          unknown;keine stündliche Vorhersage für den angegebenen Termin
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(forecast_weather_entity | trim, {}).get('forecast', []) %}
                          {% set limited_items = items[:(weather_forecast_max_items | int(120))] %}
                          {% set ts = as_timestamp(planned_next_after_reset_datetime | trim) %}
                          {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                          {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), humidity=60, condition='', confidence=70) %}
                          {% set recent = namespace(rain=0, heavy_window_rain=0, bad=0) %}
                          {% set future = namespace(rain=0, probability=0) %}
                          {% for item in limited_items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts <= ts and item_ts > (ts - 3600) %}
                              {% set fc.seen = 1 %}
                              {% set fc.rain = item.precipitation | default(0) | float(0) %}
                              {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                              {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                              {% set fc.humidity = item.humidity | default(60) | float(60) %}
                              {% set fc.condition = item.condition | default('') %}
                              {% set fc.confidence = item.confidence | default(70) | float(70) %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                              {% set recent.rain = recent.rain + (item.precipitation | default(0) | float(0)) %}
                              {% if (item.condition | default('')) in bad %}
                                {% set recent.bad = 1 %}
                              {% endif %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 7200)) %}
                              {% set recent.heavy_window_rain = recent.heavy_window_rain + (item.precipitation | default(0) | float(0)) %}
                            {% endif %}
                            {% if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) %}
                              {% set future.rain = future.rain + (item.precipitation | default(0) | float(0)) %}
                              {% set item_probability = item.precipitation_probability | default(0) | float(0) %}
                              {% if item_probability > future.probability %}
                                {% set future.probability = item_probability %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% set recent_wet = recent.rain > (forecast_rain_block_mm | float(0.2))
                              or recent.bad == 1
                              or recent.heavy_window_rain > (max_rain_24h_mm | float(3)) %}
                          {% set safe = fc.seen == 1
                              and fc.temp >= (min_mowing_temperature_c | float(10))
                              and fc.temp <= (max_mowing_temperature_c | float(25))
                              and ((forecast_rain_is_advisory | string | lower) == 'true'
                                   or ((fc.rain + future.rain) <= (forecast_rain_block_mm | float(0.2))
                                       and fc.condition not in bad
                                       and fc.probability <= (high_rain_probability_percent | float(75))
                                       and not recent_wet))
                              and (planned_next_after_reset_future_status | trim) == 'safe'
                              and fc.humidity <= (wet_grass_humidity_percent | float(88))
                              and (mowing_window_preset != 'night' or (fiatlux_installed | bool)) %}
                          {% set condition_names = {
                            'clear-night': 'klar',
                            'cloudy': 'bewölkt',
                            'exceptional': 'außergewöhnliche Bedingungen',
                            'fog': 'Nebel',
                            'hail': 'Hagel',
                            'lightning': 'Gewitter',
                            'lightning-rainy': 'Gewitter mit Regen',
                            'partlycloudy': 'teilweise bewölkt',
                            'pouring': 'starker Regen',
                            'rainy': 'Regen',
                            'snowy': 'Schnee',
                            'snowy-rainy': 'Schneeregen',
                            'sunny': 'sonnig',
                            'windy': 'windig',
                            'windy-variant': 'windig mit Wolken'
                          } %}
                          {% set condition_label = condition_names.get(fc.condition, fc.condition if fc.condition else 'brak opisu') %}
                          {{ 'safe' if safe else 'unsafe' }};{{ condition_label }}, Temperatur {{ fc.temp | round(1) }} °C, Niederschlag in der Startstunde {{ fc.rain | round(2) }} mm, Niederschlag in den nächsten {{ forecast_dry_horizon_hours }} Std. {{ future.rain | round(2) }} mm, höchstes Regenrisiko {{ [fc.probability, future.probability] | max | round(0) }}%, Luftfeuchtigkeit {{ fc.humidity | round(0) }}%{% if (smart_weather_context_available | string | lower) == 'true' %}, MeteoFusion-Sicherheit {{ fc.confidence | round(0) }}%{% endif %}
                        {% endif %}
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input last_mow_helper
                    data:
                      datetime: >-
                        {{ (normal_mowing_finished_ts | float) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                  - action: input_number.set_value
                    target:
                      entity_id: !input growth_helper
                    data:
                      value: 0
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_next_after_reset_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: Mähen abgeschlossen"
                      message: |
                        Zeit:
                        Start: {{ mowing_cycle_started_at }}
                        Ende: {{ mowing_cycle_finished_at }}
                        Gesamter Zyklus, inkl. Aufladen: {{ whole_cycle_duration_label | trim }}

                        Robotertyp:
                        {{ normal_mowing_mode_label | trim }}.

                        Gras:
                        Kumuliertes Wachstum: 0 mm.

                        {% if (planned_next_after_reset_forecast | trim).startswith('safe;') %}
                        Nächstes Mähen:
                        {{ planned_next_after_reset_label | trim }}.

                        Vorhersage während des Mähens:
                        {{ (planned_next_after_reset_forecast | trim).split(';', 1)[1] }}.
                        {% else %}
                        Nächster gespeicherter Termin:
                        {{ planned_next_after_reset_label | trim }}.

                        Hinweise:
                        Die Vorhersage bestätigt noch nicht den gesamten sicheren Zyklus.
                        Der Termin bleibt bis zur nächsten täglichen Berechnung gespeichert.
                        {% endif %}
            default:
              - action: input_number.set_value
                target:
                  entity_id: !input growth_helper
                data:
                  value: "{{ ((estimated_growth_mm | float) * 0.7) | round(1) }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                    sequence:
                      - action: input_datetime.set_datetime
                        target:
                          entity_id: "{{ next_mow_helper }}"
                        data:
                          datetime: "{{ retry_mow_datetime | trim }}"
              - action: persistent_notification.create
                data:
                  notification_id: "{{ notification_id }}"
                  title: "Worx: Mähen unterbrochen"
                  message: |
                    Zeit:
                    Start: {{ mowing_cycle_started_at }}
                    Ende: {{ mowing_cycle_finished_at }}
                    Zykluszeit bis zur Unterbrechung: {{ whole_cycle_duration_label | trim }}

                    {% if (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                           and is_state(rain_binary_sensor, 'on'))
                          or
                          (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                           and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                          or state_attr(mower_entity, 'rain_delay') == true %}
                    Grund:
                    Regen.
                    {% else %}
                    Grund:
                    Der Roboter hat die Rückkehr zur Basis nicht bestätigt.
                    {% endif %}

                    {{ retry_notification_details | trim }}

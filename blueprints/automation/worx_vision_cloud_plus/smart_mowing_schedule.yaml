blueprint:
  name: Worx Vision Cloud PLUS - Intelligenter Mähplan
  description: |
    Intelligenter Mähplan für Worx-Mähroboter, gesteuert von Home
    Assistant anstelle eines starren Zeitplans in der WORX-App.

    Was die Automatisierung macht:
    - schätzt das tägliche Graswachstum mit dem Growth Potential (GP) Modell,
    - berücksichtigt Wetter, Niederschlag, Temperatur, Sonne, optionale Bodenfeuchtigkeit,
      Bewässerung und Düngung,
    - bevorzugt das gewählte Zeitfenster, sucht aber bei Bedarf eine sichere Zeit außerhalb davon,
    - vermeidet Regen, frisch nassen Rasen und Temperaturen außerhalb des eingestellten Bereichs,
    - bevorzugt häufiges, leichtes Mähen mit dem Roboter anstatt auf hohes Gras zu warten.

    Wetterquelle:
    - eigene Wetterstation oder lokale Sensoren liefern Echtzeitmessungen,
    - die empfohlene MeteoFusion HA Integration liefert eine lokal korrigierte
      stündliche Vorhersage, aktuellen Niederschlag und eine Bewertung der Vorhersagequalität,
    - es kann auch eine andere weather-Entität verwendet werden, z.B. Tomorrow.io,
    - die Vorhersage wird einmalig bei der Planung verwendet, um eine konkrete Stunde
      ohne Niederschlag und mit einer sicheren Temperatur auszuwählen,
    - die gespeicherte Zeit wird später nicht durch regelmäßige Änderungen der Vorhersage verschoben,
    - beim Start haben die tatsächlichen Sensoren Vorrang: bei trockenem Wetter
      startet der Roboter, bei tatsächlichem Regen kehrt er zur Basis zurück,
    - die Trocknungszeit beginnt erst nach einem tatsächlichen Wechsel des Regensensors
      von `on` auf `off`; ein Neustart von HA oder eine vorübergehende Nichtverfügbarkeit des Sensors simulieren keinen Regen,
    - ohne Vorhersage nutzt die Automatisierung das gewählte Fenster und prüft die tatsächlichen
      Bedingungen direkt vor dem Start.

    Wie sieht der Mähzyklus aus:
    1. Home Assistant startet einen separaten Kantenschnitt.
    2. Die Automatisierung wartet, bis der Roboter zur Basis zurückkehrt.
    3. Der Roboter lädt den Akku auf mindestens 80%.
    4. Temperatur, Regen, Luftfeuchtigkeit und die Vorhersage für die nächsten Stunden werden
       erneut überprüft.
    5. Erst dann startet das normale einmalige Mähen.

    Robotertyp:
    - Worx Vision / RTK beendet das Mähen nach Karte oder Zone selbstständig. Der Benutzer
      muss keine Zeit für das vollständige Mähen einstellen. Rückkehr bei niedrigem Akkustand, Aufladen
      und automatische Fortsetzung werden als ein Zyklus behandelt.
    - Ältere Worx-Roboter mit Begrenzungskabel verwenden weiterhin die berechnete
      Arbeitszeit, da dies ihr Modus für einmaliges Mähen erfordert.

    Betriebsmodi:
    - der automatische Modus wählt den besten Zeitpunkt aus der stündlichen Vorhersage,
    - bei zu hoher Temperatur sucht er zuerst nach einer kühleren Stunde desselben
      Tages; mit FiatLux kann er auch die Nachtstunden bis 05:00 Uhr nutzen,
    - der Modus mit fester Zeit funktioniert wie ein klassischer Zeitplan mit einem zweiten Startversuch,
    - Nachtmähen von 22:00 bis 05:00 Uhr ist nur nach Bestätigung des FiatLux-Zubehörs verfügbar.

    Benachrichtigungen:
    - nach der täglichen Berechnung des Graswachstums,
    - nach dem Start des Mähzyklus,
    - nach Abschluss oder Unterbrechung des Zyklus nach einem tatsächlichen Start.

    Anforderungen:
    - Worx Vision Cloud PLUS Integration 1.3.1 oder neuer,
    - drei Home Assistant Helfer: Graswachstum, letztes Mähen und nächstes
      geplantes Mähen,
    - deaktivierter Mähplan in der WORX-App.

    Ursprünglich erstellt von Smart Service, ins Deutsche übersetzt von joliplei.
  domain: automation
  author: joliplei
  homeassistant:
    min_version: 2025.1.0
  source_url: https://github.com/joliplei/worx_vision_cloud_plus_automation/blob/main/blueprints/automation/worx_vision_cloud_plus/smart_mowing_schedule.yaml
  input:
    mower_section:
      name: Mähroboter
      icon: mdi:robot-mower
      input:
        mower_entity:
          name: Mähroboter
          description: Entität lawn_mower aus der Worx Vision Cloud PLUS Integration.
          selector:
            entity:
              filter:
                - domain: lawn_mower
        battery_sensor:
          name: Akku
          description: Sensor für den Akkustand des Mähroboters (in Prozent).
          selector:
            entity:
              filter:
                - domain: sensor
        rain_binary_sensor:
          name: Aktueller Niederschlagsstatus
          description: Binärer Sensor, der anzeigt, ob es aktuell regnet. Kann vom Mähroboter oder einer lokalen Wetterstation stammen. Wenn verfügbar, hat die tatsächliche Messung Vorrang vor der Regenvorhersage. Die Trocknungszeit wird nur nach einem tatsächlichen Wechsel vom Regen in den trockenen Zustand berechnet, nicht nach einem Neustart oder vorübergehender Nichtverfügbarkeit der Entität.
          selector:
            entity:
              filter:
                - domain: binary_sensor
    weather_section:
      name: Wetter
      icon: mdi:weather-partly-rainy
      input:
        temperature_source_entity:
          name: Temperatur
          description: Außentemperatursensor oder weather-Entität mit dem Attribut temperature.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        rain_source_entity:
          name: Gemessener Niederschlag
          description: Sensor für die Niederschlagssumme des aktuellen Tages oder der letzten 24 Stunden oder eine weather-Entität. Wähle nicht die momentane Niederschlagsintensität. Bei MeteoFusion HA wird die Niederschlagssumme automatisch abgerufen.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        forecast_weather_entity:
          name: Stündliche Vorhersage (optional)
          description: Empfohlen wird eine weather-Entität aus der MeteoFusion HA Integration. Die Automatisierung wählt einmalig aus ihrer Vorhersage eine konkrete trockene Stunde mit sicherer Temperatur und speichert sie bis zum Start. Es werden auch reguläre weather-Entitäten unterstützt, z.B. Tomorrow.io. Ohne Vorhersage wird das gewählte Fenster verwendet und die aktuellen Bedingungen werden zum Startzeitpunkt geprüft.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        outdoor_humidity_sensor:
          name: Luftfeuchtigkeit (optional)
          description: Lokaler Außenluftfeuchtigkeitssensor. Hilft, Tau und sehr nasses Gras zu erkennen. Ohne diesen verwendet die Automatisierung die Luftfeuchtigkeit aus der weather-Entität, falls verfügbar.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        sunlight_source_entity:
          name: Sonneneinstrahlung / UV
          description: UV-/Sonneneinstrahlungssensor oder weather-Entität mit dem Attribut uv_index.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        soil_moisture_sensor:
          name: Bodenfeuchtigkeit (optional)
          description: Kannst du leer lassen. Dann berechnet die Automatisierung eine virtuelle Feuchtigkeit basierend auf dem Wetter.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
    helpers_section:
      name: Helfer
      icon: mdi:database-clock
      input:
        growth_helper:
          name: Graswachstum
          description: input_number-Helfer, der das geschätzte Graswachstum seit dem letzten vollständigen Mähen speichert.
          selector:
            entity:
              filter:
                - domain: input_number
        last_mow_helper:
          name: Letztes Mähen
          description: input_datetime-Helfer, der nach einem vollständigen Mähzyklus aktualisiert wird.
          selector:
            entity:
              filter:
                - domain: input_datetime
        next_mow_helper:
          name: Nächstes Mähen
          description: input_datetime-Helfer, in dem die Automatisierung den voraussichtlichen Zeitpunkt des nächsten Mähens speichert.
          selector:
            entity:
              filter:
                - domain: input_datetime
    simple_settings_section:
      name: Einfache Einstellungen
      icon: mdi:tune-variant
      input:
        mower_cycle_type:
          name: Robotertyp
          description: Bei Worx Vision / RTK beendet der Roboter das Mähen nach der Karte selbstständig. Für ältere Roboter mit Begrenzungskabel verwendet die Automatisierung die berechnete Arbeitszeit.
          default: vision_rtk
          selector:
            select:
              mode: dropdown
              options:
                - label: Worx Vision / RTK
                  value: vision_rtk
                - label: Älterer Worx mit Begrenzungskabel
                  value: wired_timed
        mower_model:
          name: Mährobotermodell
          description: Wähle ein WORX Vision / Vision Cloud Modell oder den manuellen Modus für ein anderes Modell.
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: Manuell / anderes Modell
                  value: custom
                - label: Vision AI S250 WR202E - 250 m2
                  value: wr202e_250
                - label: Vision AI M600 WR206E - 600 m2
                  value: wr206e_600
                - label: Vision AI M800 WR208E - 800 m2
                  value: wr208e_800
                - label: Vision AI L1300 WR213E - 1300 m2
                  value: wr213e_1300
                - label: Vision AI L1600 WR216E - 1600 m2
                  value: wr216e_1600
                - label: Vision AI WR220 - 1/2 acre
                  value: wr220_2023
                - label: Vision Cloud 300 WR303E - 300 m2
                  value: wr303e_300
                - label: Vision Cloud 500 WR305E - 500 m2
                  value: wr305e_500
                - label: Vision Cloud 650 WR365E - 650 m2
                  value: wr365e_650
                - label: Vision Cloud 650 WR365E.1 Cut-to-Zero - 650 m2
                  value: wr365e1_650
                - label: Vision Cloud 800 WR308E - 800 m2
                  value: wr308e_800
                - label: Vision Cloud 1200 WR312E - 1200 m2
                  value: wr312e_1200
                - label: Vision Cloud 1800 WR318E - 1800 m2
                  value: wr318e_1800
                - label: Vision Cloud 3000 WR330E - 3000 m2
                  value: wr330e_3000
                - label: Vision Cloud 1/4 acre WR310/WR310.1
                  value: wr310_1012
                - label: Vision Cloud 1/2 acre WR320/WR320.1
                  value: wr320_2023
                - label: Vision Cloud 1 acre WR340
                  value: wr340_us_4047
                - label: Vision Cloud 4WD 600 WR340E - 600 m2
                  value: wr340e_600
                - label: Vision Cloud 4WD 1000 WR341E - 1000 m2
                  value: wr341e_1000
                - label: Vision Cloud 4WD 2000 WR342E - 2000 m2
                  value: wr342e_2000
                - label: Vision Cloud 4WD 4000 WR344E - 4000 m2
                  value: wr344e_4000
                - label: Vision Cloud 4WD 1/4 acre WR341/WR341.1
                  value: wr341_us_1012
                - label: Vision Cloud 4WD 1 acre WR344
                  value: wr344_us_4047
        lawn_area_m2:
          name: Rasenfläche
          description: Arbeitsfläche des Rasens in Quadratmetern.
          default: 500
          selector:
            number:
              min: 20
              max: 5000
              step: 10
              unit_of_measurement: m2
              mode: box
        growth_threshold_mode:
          name: Mähstartzeitpunkt
          description: Der automatische Modus wählt einen niedrigen Startschwellenwert für den Mähroboter. Die 1/3-Regel für die Grashalme wird nur als Sicherheitslimit behandelt, nicht als Startschwellenwert.
          default: auto_cutting_height
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatisch für Roboter
                  value: auto_cutting_height
                - label: Manueller Wachstumsschwellenwert
                  value: manual
        cutting_height_mm:
          name: Schnitthöhe
          description: Im Mähroboter eingestellte Zielhöhe des Grases. Die Automatisierung nutzt sie, um einen kleinen Startschwellenwert und ein sicheres Mählimit festzulegen.
          default: 40
          selector:
            number:
              min: 20
              max: 60
              step: 1
              unit_of_measurement: mm
              mode: slider
        planning_mode:
          name: Zeitauswahlmodus
          description: Wählt automatisch die beste Zeit aus der Vorhersage oder hält sich an eine feste Zeit.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatisch aus Wettervorhersage
                  value: auto
                - label: Feste Zeit
                  value: fixed
        mowing_window_preset:
          name: Bevorzugtes Mähfenster
          description: Die Automatisierung sucht zunächst eine sichere Stunde in diesem Fenster. Wenn das Wetter dies nicht zulässt, kann sie noch am selben Tag eine Zeit außerhalb des Fensters wählen. Die Option "Eigene Zeiten" verwendet die unten eingestellten Stunden.
          default: before_noon
          selector:
            select:
              mode: dropdown
              options:
                - label: Morgen (07:00 - 10:00)
                  value: morning
                - label: Vormittag (09:00 - 12:00)
                  value: before_noon
                - label: Mittag (11:00 - 14:00)
                  value: noon
                - label: Nachmittag (14:00 - 17:00)
                  value: afternoon
                - label: Abend (17:00 - 20:00)
                  value: evening
                - label: Nacht (22:00 - 05:00)
                  value: night
                - label: Eigene Zeiten
                  value: custom
        fiatlux_installed:
          name: Hat der Roboter das FiatLux-Zubehör montiert?
          description: Nur ankreuzen, wenn der Roboter über eine FiatLux-Beleuchtung verfügt. Dies ist für das Nachtfenster von 22:00 bis 05:00 Uhr erforderlich.
          default: false
          selector:
            boolean:
        primary_start_time:
          name: Eigener Fensteranfang
          description: Wird bei der Option "Eigene Zeiten" verwendet. Im Festzeitmodus ist dies der Hauptstart.
          default: "10:00:00"
          selector:
            time:
        backup_start_time:
          name: Eigenes Fensterende
          description: Wird bei der Option "Eigene Zeiten" verwendet. Im Festzeitmodus ist dies der zweite Versuch.
          default: "16:30:00"
          selector:
            time:
        automatic_irrigation_enabled:
          name: Automatische Bewässerung
          description: Aktivieren, wenn der Rasen regelmäßig automatisch bewässert wird.
          default: false
          selector:
            boolean:
        fertilization_enabled:
          name: Gedüngter Rasen
          description: Aktivieren, wenn der Rasen regelmäßig gedüngt wird.
          default: false
          selector:
            boolean:
    advanced_growth_section:
      name: Erweitert - Graswachstum
      icon: mdi:sprout
      collapsed: true
      input:
        growth_threshold_mm:
          name: Manueller Mähstartschwellenwert
          description: Wird nur verwendet, wenn der Mähstartzeitpunkt auf "Manueller Wachstumsschwellenwert" eingestellt ist.
          default: 3
          selector:
            number:
              min: 1
              max: 12
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        high_growth_threshold_mm:
          name: Schwellenwert für intensives Mähen
          description: Im automatischen Modus wird er aus dem Startschwellenwert und dem 1/3-Schnitthöhenlimit berechnet. Dieser Schieberegler funktioniert nur beim manuellen Wachstumsschwellenwert.
          default: 6
          selector:
            number:
              min: 2
              max: 25
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        irrigation_growth_adjustment_percent:
          name: Wachstumskorrektur bei Bewässerung
          description: Wird nur bei aktivierter automatischer Bewässerung verwendet.
          default: 140
          selector:
            number:
              min: 100
              max: 220
              step: 5
              unit_of_measurement: "%"
              mode: slider
        fertilization_growth_adjustment_percent:
          name: Wachstumskorrektur bei Düngung
          description: Wird nur bei aktivierter Düngung verwendet.
          default: 125
          selector:
            number:
              min: 100
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_days_between_mows:
          name: Mindestpause zwischen Mähvorgängen
          description: Schutz vor zu häufigem Starten. Ein Wert von 1 Tag bedeutet den nächsten Kalendertag, sodass der Roboter täglich mähen kann, wenn Wachstum und Wetter passen.
          default: 1
          selector:
            number:
              min: 0
              max: 7
              step: 0.5
              unit_of_measurement: d
              mode: slider
    advanced_runtime_section:
      name: Erweitert - Ältere Roboter mit Kabel
      icon: mdi:timer-cog
      collapsed: true
      input:
        mower_capacity_m2_per_hour:
          name: Manuelle Mähleistung
          description: Wird nur beim Typ "Älterer Worx mit Begrenzungskabel" und dem Modell "Manuell / anderes Modell" verwendet.
          default: 80
          selector:
            number:
              min: 20
              max: 250
              step: 5
              unit_of_measurement: m2/h
              mode: slider
        model_capacity_adjustment_percent:
          name: Modellleistungskorrektur
          description: Für ältere Roboter mit Kabel ermöglicht dies die Korrektur der berechneten Arbeitszeit bei engen Passagen, vielen Zonen oder einem einfachen Rasen.
          default: 100
          selector:
            number:
              min: 50
              max: 150
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_runtime_minutes:
          name: Minimale Mähzeit für Kabelroboter
          default: 45
          selector:
            number:
              min: 10
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        max_runtime_minutes:
          name: Maximale Mähzeit für Kabelroboter
          default: 120
          selector:
            number:
              min: 30
              max: 120
              step: 15
              unit_of_measurement: min
              mode: slider
    advanced_safety_section:
      name: Erweitert - Sicherheit
      icon: mdi:shield-check
      collapsed: true
      input:
        growth_update_time:
          name: Zeitpunkt der Wachstumsberechnung
          default: "05:30:00"
          selector:
            time:
        min_battery_percent:
          name: Minimaler Akkustand für den Start
          default: 45
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_mowing_temperature_c:
          name: Minimale Mähtemperatur
          description: Unterhalb dieser Temperatur wird das Mähen auf einen wärmeren Zeitpunkt verschoben.
          default: 10
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_mowing_temperature_c:
          name: Maximale Mähtemperatur
          description: Oberhalb dieser Temperatur wird das Mähen auf einen kühleren Zeitpunkt verschoben.
          default: 25
          selector:
            number:
              min: 20
              max: 40
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_rain_24h_mm:
          name: Schwellenwert für intensiven Niederschlag
          description: Nach Überschreiten dieses gemessenen Wertes verdoppelt die Automatisierung die Grastrocknungszeit. Der Niederschlag allein blockiert das Mähen nicht den ganzen Tag.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_soil_moisture_percent:
          name: Maximale Bodenfeuchtigkeit für den Start
          description: "Auf unter 100% einstellen, wenn die Bodenfeuchtigkeit den Start blockieren soll. Standardmäßig dient die Feuchtigkeit nur zur Berechnung des Graswachstums."
          default: 100
          selector:
            number:
              min: 20
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        mowing_start_confirm_timeout_minutes:
          name: Maximale Bestätigungszeit für den Mähstart
          description: Wie viele Minuten die Automatisierung auf die Abfahrt nach dem Befehl zum normalen Mähen oder Kantenschneiden wartet.
          default: 5
          selector:
            number:
              min: 2
              max: 20
              step: 1
              unit_of_measurement: min
              mode: slider

mode: single
max_exceeded: silent

triggers:
  - trigger: time
    id: update_growth
    at: !input growth_update_time
  - trigger: time
    id: start_scheduled
    at: !input next_mow_helper
  - trigger: time_pattern
    id: start_due_check
    minutes: "/5"
  - trigger: state
    id: rain_stopped
    entity_id: !input rain_binary_sensor
    from: "on"
    to: "off"
  - trigger: state
    id: external_mowing_started
    entity_id: !input mower_entity
    to: mowing
    for: "00:10:00"

variables:
  mower_entity: !input mower_entity
  battery_sensor: !input battery_sensor
  rain_binary_sensor: !input rain_binary_sensor
  temperature_source_entity: !input temperature_source_entity
  rain_source_entity: !input rain_source_entity
  forecast_weather_entity_input: !input forecast_weather_entity
  outdoor_humidity_sensor: !input outdoor_humidity_sensor
  soil_moisture_sensor: !input soil_moisture_sensor
  sunlight_source_entity: !input sunlight_source_entity
  growth_helper: !input growth_helper
  last_mow_helper: !input last_mow_helper
  next_mow_helper: !input next_mow_helper
  mower_cycle_type: !input mower_cycle_type
  mower_model: !input mower_model
  lawn_area_m2: !input lawn_area_m2
  manual_mower_capacity_m2_per_hour: !input mower_capacity_m2_per_hour
  model_capacity_adjustment_percent: !input model_capacity_adjustment_percent
  growth_threshold_mode: !input growth_threshold_mode
  cutting_height_mm: !input cutting_height_mm
  manual_growth_threshold_mm: !input growth_threshold_mm
  growth_threshold_mm: >-
    {% if growth_threshold_mode == 'auto_cutting_height' %}
      {% set height = cutting_height_mm | float(40) %}
      {% set threshold = height * 0.075 %}
      {% if threshold < 2 %}2{% elif threshold > 4.5 %}4.5{% else %}{{ threshold | round(1) }}{% endif %}
    {% else %}
      {{ manual_growth_threshold_mm }}
    {% endif %}
  automatic_irrigation_enabled: !input automatic_irrigation_enabled
  irrigation_growth_adjustment_percent: !input irrigation_growth_adjustment_percent
  fertilization_enabled: !input fertilization_enabled
  fertilization_growth_adjustment_percent: !input fertilization_growth_adjustment_percent
  manual_high_growth_threshold_mm: !input high_growth_threshold_mm
  high_growth_threshold_mm: >-
    {% if growth_threshold_mode == 'auto_cutting_height' %}
      {% set safe_limit = (cutting_height_mm | float(40)) / 3 %}
      {% set intensive = (growth_threshold_mm | float(3)) * 2 %}
      {% if intensive > safe_limit %}{{ safe_limit | round(1) }}{% else %}{{ intensive | round(1) }}{% endif %}
    {% else %}
      {{ manual_high_growth_threshold_mm }}
    {% endif %}
  min_days_between_mows: !input min_days_between_mows
  min_battery_percent: !input min_battery_percent
  min_mowing_temperature_c: !input min_mowing_temperature_c
  max_mowing_temperature_c: !input max_mowing_temperature_c
  post_edge_battery_percent: 80
  vision_completion_battery_percent: 95
  vision_completion_stable_minutes: 15
  max_rain_24h_mm: !input max_rain_24h_mm
  max_soil_moisture_percent: !input max_soil_moisture_percent
  min_runtime_minutes: !input min_runtime_minutes
  max_runtime_minutes: !input max_runtime_minutes
  mowing_start_confirm_timeout_minutes: !input mowing_start_confirm_timeout_minutes
  planning_mode: !input planning_mode
  mowing_window_preset: !input mowing_window_preset
  fiatlux_installed: !input fiatlux_installed
  custom_primary_start_time_value: !input primary_start_time
  custom_backup_start_time_value: !input backup_start_time
  primary_start_time_value: >-
    {% if mowing_window_preset == 'morning' %}07:00:00
    {% elif mowing_window_preset == 'before_noon' %}09:00:00
    {% elif mowing_window_preset == 'noon' %}11:00:00
    {% elif mowing_window_preset == 'afternoon' %}14:00:00
    {% elif mowing_window_preset == 'evening' %}17:00:00
    {% elif mowing_window_preset == 'night' %}22:00:00
    {% else %}{{ custom_primary_start_time_value }}{% endif %}
  backup_start_time_value: >-
